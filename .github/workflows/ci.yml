name: exact-candidate
on: [pull_request, push]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with: {components: rustfmt, clippy}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: taiki-e/install-action@v2
        with: {tool: cargo-deny}
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: ./scripts/verify-prototype.sh
      - name: Bind exact candidate evidence
        run: |
          SOURCE_SHA="$GITHUB_SHA" node scripts/evidence-manifest.mjs
          sed -E -i "s/Candidate: .*/Candidate: \`$GITHUB_SHA\`/" evidence/semantic-review.md
          grep -F "$GITHUB_SHA" evidence/semantic-review.md
          grep -F "$GITHUB_SHA" evidence/prototype/manifest.json
      - name: Containerized full-stack acceptance
        run: |
          docker compose up -d --build
          trap 'docker compose down -v' EXIT
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:18080/readyz >/dev/null && curl -fsS http://127.0.0.1:5173 >/dev/null && break; sleep 2; done
          cd frontend && npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prototype-evidence-${{ github.sha }}
          path: |
            evidence/**
            frontend/test-results/**
            frontend/playwright-report/**
